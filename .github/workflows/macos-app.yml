# Builds liGPSPORT.app for Apple Silicon and uploads it as a .dmg
# workflow artifact. The bundle is only ad-hoc signed (no Developer
# ID, no notarization). A browser download gets quarantined and then
# hangs at launch on macOS 26; the README explains how to avoid that.
name: macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install '.[gui]' pyinstaller
      - name: Icon
        run: python packaging/macos/make_icon.py build/macos/ligpsport.icns
      - name: Bundle
        run: pyinstaller --noconfirm packaging/macos/ligpsport-gui.spec
      - name: Smoke test
        run: |
          file dist/liGPSPORT.app/Contents/MacOS/liGPSPORT
          codesign --verify --deep --strict dist/liGPSPORT.app
          dist/liGPSPORT.app/Contents/MacOS/liGPSPORT --version
          plutil -extract NSBluetoothAlwaysUsageDescription raw \
            dist/liGPSPORT.app/Contents/Info.plist
      - name: Disk image
        run: |
          version=$(python -c 'import ligpsport; print(ligpsport.__version__)')
          mkdir -p build/dmg
          cp -R dist/liGPSPORT.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname liGPSPORT -srcfolder build/dmg -ov -format UDZO \
            "dist/liGPSPORT-${version}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: liGPSPORT-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
